name: 🌐 Telegram KR & US Market RSI Scanner

on:
  schedule:
    # 🧪 [테스트 중] 30분마다 한/미 스캐너 동시 실행 (테스트 끝나면 '0 * * * *' 로 변경하시면 됩니다)
    - cron: '*/30 * * * *'
  workflow_dispatch: # 수동 테스트 실행 버튼

jobs:
  run-dual-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install pandas numpy requests beautifulsoup4 yfinance

      - name: 🇰🇷 한국장 4시간봉 RSI 스캐너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rsi_kr_bot.py

      - name: 🇺🇸 미국장 4시간봉 RSI 스캐너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rsi_us_bot.py

      - name: 한/미 실행 로그 및 상태 파일 통합 커밋
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          KST_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S KST')
          echo "[$KST_TIME] 🌐 한국/미국 RSI 스캔 완료" >> scanner_log.txt
          tail -n 100 scanner_log.txt > temp_log.txt && mv temp_log.txt scanner_log.txt
          
          # 생성된 로그 및 JSON 상태 파일(kr_state.json, us_state.json 등) 전체 업데이트
          git add -A
          git commit -m "log: update KR & US scan status ($KST_TIME)" || exit 0
          git push || exit 0