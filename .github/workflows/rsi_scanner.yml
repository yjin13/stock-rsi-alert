name: 🌐 Telegram KR & US Market RSI Scanner

on:
  # 💡 실행은 외부 스케줄러(cron-job.org)가 30분마다 GitHub API로 이 workflow_dispatch를 호출해서 한다.
  #    (자체 schedule 없음. 수동 실행도 같은 트리거로 가능)
  workflow_dispatch:

concurrency:
  group: rsi-scanner  # 백필로 오래 걸려도 실행이 겹쳐 커밋/푸시가 충돌하지 않도록 순차 실행
  cancel-in-progress: false

jobs:
  run-dual-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests holidays yfinance

      - name: 🔑 토큰 만료 임박 알림 (만료 7일 전부터 하루 1회)
        continue-on-error: true  # 알림 문제로 스캐너가 막히지 않게 한다
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bots.check_token_expiry

      - name: KIS 접근토큰 캐시 복원 (재발급 제한·알림톡 방지)
        uses: actions/cache@v4
        with:
          path: ~/.kis_token.json
          key: kis-token-${{ github.run_id }}
          restore-keys: kis-token-

      - name: 🇰🇷 한국장 4시간봉 RSI 스캐너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python -m bots.rsi_kr_bot

      - name: 🇺🇸 미국장 4시간봉 RSI 스캐너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python -m bots.rsi_us_bot

      - name: 한/미 실행 로그 및 상태 파일 통합 커밋
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          KST_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S KST')
          echo "[$KST_TIME] 🌐 한국/미국 RSI 스캔 완료" >> data/scanner_log.txt
          tail -n 100 data/scanner_log.txt > data/temp_log.txt && mv data/temp_log.txt data/scanner_log.txt
          
          git add -A
          git commit -m "log: update KR & US scan status ($KST_TIME)" || exit 0
          git push || exit 0