name: 🌐 Telegram KR & US Market RSI Scanner

on:
  # 💡 실행은 외부 스케줄러(cron-job.org)가 30분마다 GitHub API로 이 workflow_dispatch를 호출해서 한다.
  #    (자체 schedule 없음. 수동 실행도 같은 트리거로 가능)
  workflow_dispatch:

concurrency:
  group: rsi-scanner  # 백필로 오래 걸려도 실행이 겹쳐 커밋/푸시가 충돌하지 않도록 순차 실행
  cancel-in-progress: false

jobs:
  run-dual-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests holidays yfinance

      - name: 🔑 토큰 만료 임박 알림 (만료 7일 전부터 하루 1회)
        continue-on-error: true  # 알림 문제로 스캐너가 막히지 않게 한다
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bots.check_token_expiry

      - name: KIS 접근토큰 캐시 복원 (재발급 제한·알림톡 방지)
        uses: actions/cache@v4
        with:
          path: ~/.kis_token.json
          key: kis-token-${{ github.run_id }}
          restore-keys: kis-token-

      - name: 상태·캐시·로그 복원 (매 실행 커밋 대신 actions/cache로 실행 간 유지)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/*_state.json
            data/*_4h_cache.json
            data/scanner_log.txt
          key: rsi-data-${{ github.run_id }}
          restore-keys: rsi-data-  # 가장 최근에 저장된 캐시를 복원(없으면 저장소에 커밋된 파일로 시작)

      - name: 🇰🇷 한국장 4시간봉 RSI 스캐너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python -m bots.rsi_kr_bot

      - name: 🇺🇸 미국장 4시간봉 RSI 스캐너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python -m bots.rsi_us_bot

      - name: 실행 로그 기록
        if: always()  # 스캐너가 실패해도 상태·로그는 보존한다
        run: |
          KST_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S KST')
          echo "[$KST_TIME] 🌐 한국/미국 RSI 스캔 완료" >> data/scanner_log.txt
          tail -n 100 data/scanner_log.txt > data/temp_log.txt && mv data/temp_log.txt data/scanner_log.txt

      - name: 상태·캐시·로그 저장 (매 실행)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/*_state.json
            data/*_4h_cache.json
            data/scanner_log.txt
          key: rsi-data-${{ github.run_id }}

      - name: 하루 한 번 상태 파일 통합 커밋 (백업용, KST 15:30 이후 첫 실행)
        if: always()
        run: |
          KST_HM=$(TZ='Asia/Seoul' date '+%H%M')
          # 하루 마지막 스캔(KST 15:35) 이후에만 커밋. 그 외 실행은 캐시만 갱신한다.
          if [ "$((10#$KST_HM))" -lt 1530 ]; then
            echo "커밋 생략 (KST $KST_HM)"; exit 0
          fi
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "log: update KR & US scan status ($(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S KST'))"
          git pull --rebase -X theirs || true
          git push || exit 0
