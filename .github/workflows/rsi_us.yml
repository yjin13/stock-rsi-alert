name: 🇺🇸 Telegram US Market RSI Scanner

on:
  schedule:
    # 미국장 프리~애프터 및 마감 체크 시간(KST 17:00 ~ 익일 11:00 / UTC 0시~2시, 8시~23시) 매시 정각(0분) 실행
    - cron: '0 0-2,8-23 * * *'
  workflow_dispatch:

jobs:
  run-us-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install pandas numpy requests yfinance

      - name: 미국장 4시간봉 RSI 스캐너 실행 (정각 실행 & 1분 내 완료)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rsi_us_bot.py

      - name: 미국장 상태 파일 및 실행 로그 자동 커밋
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          KST_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S KST')
          echo "[$KST_TIME] 🇺🇸 미국장 매시 정각 스캔 완료" >> us_log.txt
          tail -n 100 us_log.txt > temp_log.txt && mv temp_log.txt us_log.txt
          
          git add us_log.txt us_state.json
          git commit -m "log: update US market status ($KST_TIME)" || exit 0
          git push || exit 0