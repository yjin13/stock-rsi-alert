name: Telegram KR/US Dual Market RSI Scanner

on:
  schedule:
    # 1. 한국장 평일(월~금) 09:00~15:30 (UTC 00:00~06:30) 30분 간격
    - cron: '0,30 0-6 * * 1-5'
    # 2. 미국장 평일(월~금) 서머타임/일반장 시간 전체 커버 (UTC 13:00~21:00) 30분 간격
    - cron: '0,30 13-21 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-rsi-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 로그 기록 자동 커밋 권한
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install pandas numpy requests beautifulsoup4 yfinance

      - name: 한/미 주식시장 4H RSI 스캐너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rsi_kr_us_bot.py

      - name: 실행 로그 기록 및 60일 휴면 방지 자동 커밋
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 한국 시간(KST) 및 UTC 시간 계산
          KST_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S KST')
          
          echo "[$KST_TIME] ✅ 한/미 주도주 4시간봉 RSI 30분 간격 정규장 스캔 정상 완료" >> execution_log.txt
          
          # 최근 200줄의 로그만 유지
          tail -n 200 execution_log.txt > temp_log.txt && mv temp_log.txt execution_log.txt
          
          git add execution_log.txt
          git commit -m "log: update dual market execution log ($KST_TIME)" || exit 0
          git push || exit 0