name: Telegram 4H RSI Scanner

on:
  schedule:
    # 한국 시간 평일(월~금) 09:00 ~ 15:00 매시 정각 (UTC 기준 0~6시)
    - cron: '0 0-6 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-rsi-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install pandas numpy requests beautifulsoup4

      - name: RSI 스캐너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rsi_telegram_bot.py