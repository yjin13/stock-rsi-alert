name: Telegram 24H Full-Market (KR/US Pre & After) RSI Scanner

on:
  schedule:
    # 평일(월~금) 24시간 내내 10분마다 실행 (API 차단 방지 및 4시간봉 최적화)
    - cron: '*/30 * * * 1-5'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-rsi-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 로그 및 상태 파일 자동 커밋을 위한 쓰기 권한
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install pandas numpy requests beautifulsoup4 yfinance

      - name: 한국/미국 24H 프리장·애프터장 4시간봉 RSI 스캐너 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rsi_kr_us_bot.py

      - name: 실행 날짜 및 로그 업데이트 + 60일 휴면 방지 자동 커밋
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          KST_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S KST')
          echo "[$KST_TIME] ✅ 한/미 (프리장/정규장/애프터장) 10분 간격 RSI 스캔 완료" >> execution_log.txt
          
          tail -n 200 execution_log.txt > temp_log.txt && mv temp_log.txt execution_log.txt
          
          git add execution_log.txt daily_summary_state.json
          git commit -m "log: update daily scan status ($KST_TIME)" || exit 0
          git push || exit 0